@if(errorService.errorMessage()){
  <div class="error">
    <p>Its so over: ${{errorService.errorMessage()}}</p>
    <button (click)="errorService.clearError()">Dismiss</button>
  </div>
}
<div class="container">
  @if (isLoading()) {
    <p>Loading...</p>
  } @else {
    <button (click)="guard.toggle()">@if (guard.guardEnabled() === true) {
      Unlock Editing
    } @else {Lock Editing} </button>
    <a routerLink="/add" routerLinkActive = "active"><button>Add Country</button></a>
    <h3>Countries</h3>
  }
</div>


<router-outlet />
